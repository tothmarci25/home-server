---
# tasks file for roles/cloudflare_ddns

- name: Fail if required Cloudflare settings were not provided
  assert:
    that:
      - cloudflare_ddns_api_token | length > 0
      - cloudflare_ddns_zone_name | length > 0
      - cloudflare_ddns_record_name | length > 0
    fail_msg: >-
      CLOUDFLARE_DDNS_API_TOKEN, CLOUDFLARE_DDNS_ZONE_NAME and
      CLOUDFLARE_DDNS_RECORD_NAME must all be set in .env.

- name: Install Python DDNS dependencies
  apt:
    name:
      - python3
      - python3-requests
      - python3-cloudflare
    state: present
    update_cache: yes

- name: Deploy the Cloudflare DDNS script
  template:
    src: cloudflare_ddns.py.j2
    dest: "{{ cloudflare_ddns_script_path }}"
    owner: root
    group: root
    mode: '0755'
  notify: run cloudflare-ddns now

- name: Deploy the API token environment file
  copy:
    dest: "{{ cloudflare_ddns_env_file }}"
    content: "CLOUDFLARE_DDNS_API_TOKEN={{ cloudflare_ddns_api_token }}\n"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: run cloudflare-ddns now

- name: Deploy the systemd service unit
  template:
    src: cloudflare-ddns.service.j2
    dest: /etc/systemd/system/cloudflare-ddns.service
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd

- name: Deploy the systemd timer unit
  template:
    src: cloudflare-ddns.timer.j2
    dest: /etc/systemd/system/cloudflare-ddns.timer
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd

- name: Flush handlers so the timer unit is reloaded before enabling
  meta: flush_handlers

- name: Enable and start the Cloudflare DDNS timer
  systemd:
    name: cloudflare-ddns.timer
    enabled: yes
    state: started
    daemon_reload: yes
