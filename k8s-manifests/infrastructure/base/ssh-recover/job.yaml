apiVersion: batch/v1
kind: Job
metadata:
  name: ssh-recover
  namespace: default
spec:
  backoffLimit: 4
  # Plain managed Job: no Replace, no TTL, no hook. The pod shows up in the Argo CD
  # resource tree and its logs stay readable after completion. To re-run, delete the
  # existing Job in the Argo CD UI first, then sync (avoids the immutable-Job/spec.selector
  # error that Replace=true caused on a completed Job).
  template:
    spec:
      # hostPID lets nsenter reach host PID 1; hostNetwork keeps us out of the pod netns.
      hostPID: true
      hostNetwork: true
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/os: linux
      # Safety net: the single-node cluster normally has the control-plane taint removed
      # (k8s_init role), but tolerate everything so the Job schedules regardless.
      tolerations:
        - operator: Exists
      containers:
        - name: recover
          # debian:stable-slim ships util-linux, so nsenter is present and reliable.
          image: debian:stable-slim
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -x
              # Enter the host's mount/uts/ipc/net/pid namespaces via PID 1 (host init),
              # then recover sshd on the Ubuntu host itself.
              # NOTE: sshd_config is intentionally NOT modified — we assume it still
              # declares "Port 2222". We only (re)start the service and re-open UFW 2222.
              nsenter -t 1 -m -u -i -n -p -- sh -c '
                echo "=== restart + enable sshd ===";
                (systemctl restart ssh 2>/dev/null || systemctl restart sshd 2>/dev/null) && echo "ssh restarted";
                systemctl enable ssh 2>/dev/null || systemctl enable sshd 2>/dev/null || true;
                systemctl status ssh --no-pager 2>/dev/null || systemctl status sshd --no-pager 2>/dev/null || true;

                echo "=== re-open UFW for port 2222 (was configured before) ===";
                if command -v ufw >/dev/null 2>&1; then
                  ufw allow 2222/tcp || true;
                  ufw reload 2>/dev/null || true;
                  echo "--- ufw status ---";
                  ufw status verbose | grep -E "2222|Status" || ufw status verbose || true;
                else
                  echo "ufw not installed on host";
                fi;

                echo "=== listening sockets ===";
                ss -tlnp | grep -E ":22 |:2222 " || echo "no ssh socket listening on 22/2222";

                echo "=== interfaces + wg address ===";
                ip -brief addr show | grep -Ei "wg|eth|ens|enp|UP" || ip -brief addr show;

                echo "=== ufw full status (numbered) ===";
                ufw status numbered 2>/dev/null || true;

                echo "=== iptables filter INPUT (look for REJECT hitting 2222 / wg0) ===";
                iptables -S INPUT 2>/dev/null | head -50 || true;
                echo "--- ufw-user-input / ufw-before-input chains ---";
                iptables -S 2>/dev/null | grep -Ei "2222|ufw-user-input|ufw-before-input|wg0" | head -60 || true;

                echo "=== nat PREROUTING/OUTPUT (kube-proxy port hijack of 2222?) ===";
                iptables -t nat -S 2>/dev/null | grep -E "2222|:22 |dpt:22" | head -40 || echo "no nat rule mentioning 22/2222";

                echo "=== is anything else bound to 2222 (conflicting)? ===";
                ss -tlnp | grep ":2222 " || true;

                echo "=== quick self-test from the host to its own wg + lan IP on 2222 ===";
                (command -v nc >/dev/null 2>&1 && nc -vz -w 3 10.8.0.1 2222) || echo "nc to 10.8.0.1:2222 failed/absent";
                (command -v nc >/dev/null 2>&1 && nc -vz -w 3 127.0.0.1 2222) || echo "nc to 127.0.0.1:2222 failed/absent";
              '
