apiVersion: batch/v1
kind: Job
metadata:
  name: ssh-recover
  namespace: default
spec:
  backoffLimit: 4
  # Plain managed Job: no Replace, no TTL, no hook. The pod shows up in the Argo CD
  # resource tree and its logs stay readable after completion. To re-run, delete the
  # existing Job in the Argo CD UI first, then sync (avoids the immutable-Job/spec.selector
  # error that Replace=true caused on a completed Job).
  template:
    spec:
      # hostPID lets nsenter reach host PID 1; hostNetwork keeps us out of the pod netns.
      hostPID: true
      hostNetwork: true
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/os: linux
      # Safety net: the single-node cluster normally has the control-plane taint removed
      # (k8s_init role), but tolerate everything so the Job schedules regardless.
      tolerations:
        - operator: Exists
      containers:
        - name: recover
          # debian:stable-slim ships util-linux, so nsenter is present and reliable.
          image: debian:stable-slim
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -x
              # ssh listener is stuck on [::]:2222 while IPv4 (incl. 127.0.0.1) is REFUSED.
              # A [::] socket normally accepts IPv4 too, so this points at either
              # net.ipv6.bindv6only=1, an explicit IPv6-only ListenAddress in sshd_config,
              # or socket-activation binding IPv6-only. This run REPORTS ground truth, then
              # applies a robust fix: disable socket activation and force sshd to bind IPv4
              # directly via a sshd_config drop-in (Port 2222 + ListenAddress 0.0.0.0/::).
              nsenter -t 1 -m -u -i -n -p -- sh -c '
                echo "=== GROUND TRUTH: sshd_config listen/port/addressfamily ===";
                grep -RniE "^\s*(Port|ListenAddress|AddressFamily)" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null || echo "none found";
                echo "--- ssh.socket effective ListenStream ---";
                systemctl cat ssh.socket 2>/dev/null | grep -i ListenStream || echo "ssh.socket not present";
                echo "--- systemctl is-active/enabled: ssh.socket ---";
                systemctl is-active ssh.socket 2>/dev/null; systemctl is-enabled ssh.socket 2>/dev/null;
                echo "--- net.ipv6.bindv6only ---";
                sysctl net.ipv6.bindv6only 2>/dev/null || cat /proc/sys/net/ipv6/bindv6only 2>/dev/null;

                echo "=== FIX: disable socket activation, bind sshd directly on IPv4+IPv6 ===";
                # Remove any prior drop-in from the earlier attempt.
                rm -f /etc/systemd/system/ssh.socket.d/10-ipv4-2222.conf 2>/dev/null || true;
                # sshd_config drop-in: explicit port + both address families.
                mkdir -p /etc/ssh/sshd_config.d;
                printf "%s\n" "Port 2222" "ListenAddress 0.0.0.0" "ListenAddress ::" "AddressFamily any" > /etc/ssh/sshd_config.d/99-recover-listen.conf;
                echo "--- wrote /etc/ssh/sshd_config.d/99-recover-listen.conf ---";
                cat /etc/ssh/sshd_config.d/99-recover-listen.conf;
                echo "--- sshd -t config test ---";
                sshd -t && echo "sshd config OK" || echo "sshd config INVALID (see above)";

                # Stop socket activation so it cannot hold/own the port, then run ssh.service directly.
                systemctl stop ssh.socket 2>/dev/null || true;
                systemctl disable ssh.socket 2>/dev/null || true;
                systemctl daemon-reload;
                systemctl restart ssh 2>/dev/null || systemctl restart sshd 2>/dev/null;
                systemctl enable ssh 2>/dev/null || systemctl enable sshd 2>/dev/null || true;
                echo "ssh restarted";

                echo "=== ensure UFW allows 2222 (idempotent) ===";
                if command -v ufw >/dev/null 2>&1; then ufw allow 2222/tcp || true; ufw reload 2>/dev/null || true; fi;

                echo "=== listening sockets (want 0.0.0.0:2222 and/or [::]:2222) ===";
                ss -tlnp | grep ":2222 " || echo "no ssh socket listening on 2222";

                echo "=== self-test over IPv4 (the failing path) ===";
                (command -v nc >/dev/null 2>&1 && nc -vz -w 3 127.0.0.1 2222) || echo "nc 127.0.0.1:2222 failed/absent";
                (command -v nc >/dev/null 2>&1 && nc -vz -w 3 192.168.0.54 2222) || echo "nc 192.168.0.54:2222 failed/absent";
                (command -v nc >/dev/null 2>&1 && nc -vz -w 3 10.8.0.1 2222) || echo "nc 10.8.0.1:2222 failed/absent";
              '
