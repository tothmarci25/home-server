apiVersion: batch/v1
kind: Job
metadata:
  name: ssh-recover
  namespace: default
spec:
  backoffLimit: 4
  # Plain managed Job: no Replace, no TTL, no hook. The pod shows up in the Argo CD
  # resource tree and its logs stay readable after completion. To re-run, delete the
  # existing Job in the Argo CD UI first, then sync (avoids the immutable-Job/spec.selector
  # error that Replace=true caused on a completed Job).
  template:
    spec:
      # hostPID lets nsenter reach host PID 1; hostNetwork keeps us out of the pod netns.
      hostPID: true
      hostNetwork: true
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/os: linux
      # Safety net: the single-node cluster normally has the control-plane taint removed
      # (k8s_init role), but tolerate everything so the Job schedules regardless.
      tolerations:
        - operator: Exists
      containers:
        - name: recover
          # debian:stable-slim ships util-linux, so nsenter is present and reliable.
          image: debian:stable-slim
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -x
              # ROOT CAUSE: ssh is socket-activated (ssh.socket). Its ListenStream was
              # binding IPv6 only ([::]:2222), so IPv4 clients (127.0.0.1, 192.168.0.54,
              # 10.8.0.1) got "Connection refused" even though sshd/UFW were healthy.
              # FIX: add an explicit IPv4 ListenStream via a drop-in on ssh.socket, then
              # reload + restart the socket so it binds 0.0.0.0:2222 as well.
              nsenter -t 1 -m -u -i -n -p -- sh -c '
                echo "=== add IPv4 ListenStream drop-in for ssh.socket ===";
                mkdir -p /etc/systemd/system/ssh.socket.d;
                printf "%s\n" "[Socket]" "ListenStream=" "ListenStream=0.0.0.0:2222" "ListenStream=[::]:2222" > /etc/systemd/system/ssh.socket.d/10-ipv4-2222.conf;
                echo "--- drop-in written ---";
                cat /etc/systemd/system/ssh.socket.d/10-ipv4-2222.conf;

                echo "=== reload systemd + restart ssh.socket and ssh.service ===";
                systemctl daemon-reload;
                systemctl restart ssh.socket 2>/dev/null || true;
                (systemctl restart ssh 2>/dev/null || systemctl restart sshd 2>/dev/null) && echo "ssh restarted";
                systemctl enable ssh 2>/dev/null || systemctl enable sshd 2>/dev/null || true;

                echo "=== ensure UFW allows 2222 (idempotent) ===";
                if command -v ufw >/dev/null 2>&1; then ufw allow 2222/tcp || true; ufw reload 2>/dev/null || true; fi;

                echo "=== listening sockets (want BOTH 0.0.0.0:2222 AND [::]:2222) ===";
                ss -tlnp | grep ":2222 " || echo "no ssh socket listening on 2222";

                echo "=== self-test over IPv4 (the failing path) ===";
                (command -v nc >/dev/null 2>&1 && nc -vz -w 3 127.0.0.1 2222) || echo "nc 127.0.0.1:2222 failed/absent";
                (command -v nc >/dev/null 2>&1 && nc -vz -w 3 192.168.0.54 2222) || echo "nc 192.168.0.54:2222 failed/absent";
                (command -v nc >/dev/null 2>&1 && nc -vz -w 3 10.8.0.1 2222) || echo "nc 10.8.0.1:2222 failed/absent";
              '
