# Long-lived (non-expiring) token for the `vault` ServiceAccount, used by the
# bootstrap Job as Vault's `token_reviewer_jwt` in auth/kubernetes/config.
#
# Why this exists: a projected SA token (/var/run/secrets/.../token) is
# time-bound and expires. When Vault's stored reviewer JWT expires, every
# Kubernetes auth login starts returning 403 permission denied for ALL roles
# (the TokenReview call Vault makes is itself rejected), silently breaking all
# vault-backed apps on the next secret (re)mount. A Secret of type
# kubernetes.io/service-account-token is populated by the token controller with
# a token that does not expire, so the reviewer JWT never rots.
apiVersion: v1
kind: Secret
metadata:
  name: vault-reviewer-token
  namespace: vault
  annotations:
    kubernetes.io/service-account.name: vault
    # Ensure this is populated before the bootstrap Job (sync-wave "1") runs.
    argocd.argoproj.io/sync-wave: "0"
type: kubernetes.io/service-account-token
