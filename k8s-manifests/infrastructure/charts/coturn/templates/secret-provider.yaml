apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: coturn-vault
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider: vault
  # Sync the mounted secret into a Kubernetes Secret so the Deployment can
  # consume it via secretKeyRef. This is the SAME Vault value the soda chart
  # reads as SELKIES_TURN_SHARED_SECRET (kv/coturn/auth key "shared-secret") --
  # one secret, two consumers. coturn uses it as its static-auth-secret; Selkies
  # derives the per-browser ephemeral HMAC credential from it. See REMOTE-ACCESS.md.
  # The secret only materializes while a pod mounts this SecretProviderClass.
  secretObjects:
    - secretName: coturn-auth
      type: Opaque
      data:
        - objectName: "shared-secret"
          key: "shared-secret"
  parameters:
    vaultAddress: "http://vault.vault.svc:8200"
    roleName: "coturn"
    audience: "vault"
    objects: |
      - objectName: "shared-secret"
        secretPath: "kv/data/coturn/auth"
        secretKey: "shared-secret"
