apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: soda-vault
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  provider: vault
  # Sync the mounted secret into a Kubernetes Secret so the StatefulSet can
  # consume it via secretKeyRef as the SELKIES_BASIC_AUTH_PASSWORD env var.
  # The secret only materializes while a pod mounts this SecretProviderClass.
  secretObjects:
    - secretName: soda-auth
      type: Opaque
      data:
        - objectName: "password"
          key: "password"
    {{- if .Values.soda.webrtc.enabled }}
    # Shared HMAC TURN secret -> soda-turn Secret, consumed by the StatefulSet as
    # SELKIES_TURN_SHARED_SECRET. Same Vault value coturn reads as its
    # static-auth-secret (one secret, two consumers). See REMOTE-ACCESS.md.
    - secretName: soda-turn
      type: Opaque
      data:
        - objectName: "turn-shared-secret"
          key: "shared-secret"
    {{- end }}
  parameters:
    vaultAddress: "http://vault.vault.svc:8200"
    roleName: "soda"
    audience: "vault"
    objects: |
      - objectName: "password"
        secretPath: "kv/data/soda/auth"
        secretKey: "password"
      {{- if .Values.soda.webrtc.enabled }}
      - objectName: "turn-shared-secret"
        secretPath: "kv/data/coturn/auth"
        secretKey: "shared-secret"
      {{- end }}
