apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: soda-vault
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  provider: vault
  # Sync the mounted secret into a Kubernetes Secret so the StatefulSet can
  # consume it via secretKeyRef as the SELKIES_BASIC_AUTH_PASSWORD env var.
  # The secret only materializes while a pod mounts this SecretProviderClass.
  secretObjects:
    - secretName: soda-auth
      type: Opaque
      data:
        - objectName: "password"
          key: "password"
  parameters:
    vaultAddress: "http://vault.vault.svc:8200"
    roleName: "soda"
    audience: "vault"
    objects: |
      - objectName: "password"
        secretPath: "kv/data/soda/auth"
        secretKey: "password"
