# Default values for the soda chart. Production overrides live in
# k8s-manifests/infrastructure/values/production/soda-values.yaml (referenced
# by the ArgoCD Application). Keep this self-contained so `helm template` works.
soda:
  # Start at 2 (host soda-0 + one client). Scale later only if node RAM allows.
  replicas: 2

  # Step A smoke test uses the stock Selkies image (no Wine). Step B swaps this
  # for the custom Wine image. Pin by tag/digest.
  image: ghcr.io/selkies-project/selkies/desktop:2.0.0-ubuntu26.04
  imagePullPolicy: IfNotPresent

  basicAuthUser: player

  # --- Remote play (Phase 1) --------------------------------------------------
  # When true, render the public Ingress (racing/racing-2 -> soda-0/soda-1) for
  # Cloudflare-fronted remote WebRTC play. Off by default so a bare `helm template`
  # stays LAN-only. Enabled in production values. See REMOTE-ACCESS.md.
  publicHosts: false
  publicHost: racing.tothmarci25.com
  publicHost2: racing-2.tothmarci25.com

  # WebRTC transport. When webrtc.enabled is true the StatefulSet switches Selkies
  # to SELKIES_MODE=webrtc (no WebSocket fallback) and wires it to coturn with an
  # ephemeral HMAC credential derived from the shared secret (same value coturn
  # holds as static-auth-secret). Off by default -> LAN WebSocket pixel path.
  webrtc:
    enabled: false
    turnHost: turn.tothmarci25.com
    turnPort: 3478
    turnProtocol: udp
    # Public STUN for server-reflexive candidates; coturn handles the relay.
    stunHost: stun.l.google.com
    stunPort: 19302
    # WebRTC video codec. Decided at implementation: x264enc is broadly supported
    # by Selkies' WebRTC path and far lighter than JPEG-over-WebSocket for 60fps
    # motion on a home uplink. Override if the pinned image advertises something
    # better (check `selkies --help` / the image's encoder list at deploy time).
    encoder: x264enc

  # Host GIDs for /dev/dri (video, render) — read via `getent group video render`
  # on the node at implement time. Placeholder values; override in production.
  gpuGroups:
    - 44
    - 993

  # Per-pod node-local storage (outside Longhorn, not backed up by Velero).
  storageClassName: soda-data-pv
  localPathBase: /mnt/ssd/soda
  dataSize: 20Gi
  nodeName: tothmarci25-homeserver

  shmSize: 2Gi

  # TLS Secret (kubernetes.io/tls) the Ingress terminates with. Created manually
  # out-of-band (self-signed, internal-only) — NOT managed by this chart and NOT
  # in git. See the chart README / plan for the openssl + kubectl commands.
  tlsSecretName: soda-tls

  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      memory: 4Gi
