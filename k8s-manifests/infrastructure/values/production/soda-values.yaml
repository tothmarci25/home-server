# Production overrides for the soda chart.
soda:
  # 2-player start (host soda-0 + client soda-1). Bump only with RAM headroom.
  replicas: 2

  # Step B: custom Selkies + 32-bit Wine image (public on GHCR).
  # Built from charts/soda/image/Dockerfile for linux/amd64.
  image: ghcr.io/tothmarci25/soda-selkies:0.1.1

  # Node GIDs confirmed on tothmarci25-homeserver via `getent group video render`:
  #   video:x:44:  render:x:993:
  # If the iGPU does not come through at runtime, Selkies falls back to llvmpipe
  # software rendering (acceptable for SODA).
  gpuGroups:
    - 44
    - 993

  storageClassName: soda-data-pv
  localPathBase: /mnt/ssd/soda
  dataSize: 20Gi
  nodeName: tothmarci25-homeserver
